<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品編集 - 在庫通知くん</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 1.5rem; }
    .alert { white-space: pre-line; }
  </style>
</head>
<body class="bg-light">
  <div class="container" style="max-width: 760px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">✏ 商品編集</h2>
      <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">← 戻る</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category=='error' else category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card">
      <div class="card-body">
        <form method="post" action="{{ url_for('edit', pid=product.id) }}">
          <div class="mb-3">
            <label class="form-label">名前</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">URL</label>
            <input type="url" name="url" class="form-control" value="{{ product.url }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">サイズパターン</label>
            <input type="text" name="size_pattern" class="form-control" value="{{ product.size_pattern }}">
          </div>
          <div class="mb-3">
            <label class="form-label">在庫キーワード</label>
            <input type="text" name="stock_keyword" class="form-control" value="{{ product.stock_keyword }}">
          </div>
          <div class="mb-3">
            <label class="form-label">監視間隔（分）</label>
            <input type="number" name="check_interval" min="0" step="1" class="form-control"
                   value="{{ product.check_interval if product.check_interval is defined else 0 }}"
                   placeholder="0 = 毎回チェック（デフォルト）">
            <div class="form-text">例: 30 → 前回チェックから30分経過するまでスキップ。空欄/0で毎回。</div>
          </div>
          <div class="mb-3">
            <label class="form-label">POIZON SKU ID <small class="text-muted">(任意・売切れ自動取消用)</small></label>
            <input type="text" name="poizon_sku_id" class="form-control" value="{{ product.poizon_sku_id }}"
                   placeholder="例: 894537995（POIZON出品管理画面からコピー・空欄で連動なし）">
            <div class="form-text">この商品が売切れたら、このskuIdのPOIZON出品を自動で取り下げます。</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">キャンセル</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
