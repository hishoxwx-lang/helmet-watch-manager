<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - 在庫通知くん</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 4rem; }
    .alert { white-space: pre-line; }
  </style>
</head>
<body class="bg-light">
  <div class="container" style="max-width: 380px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="text-center mb-3">🪖 ログイン</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category=='error' else category }} py-2 mb-3" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label">パスワード</label>
            <input type="password" name="password" class="form-control" autofocus required>
          </div>
          <button type="submit" class="btn btn-primary w-100">ログイン</button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">在庫通知くん</p>
  </div>
</body>
</html>
